# Expose Astro dependencies for `pnpm` users (movido desde .npmrc: pnpm 11 lee esto aquí)
shamefullyHoist: true
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - astro@7.2.9
overrides:
  react: 19.2.8
  react-dom: 19.2.8
